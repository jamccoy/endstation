[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstation"
# Read from `endstation.__version__` rather than restated here. Two literals
# drift, and the one that drifts is always the one nobody looks at.
dynamic = ["version"]
description = "Shared scaffolding for desktop scientific applications: optional-dependency guards, cancellable workers, Qt/matplotlib panes, and macOS app bundling"
readme = "README.md"
# 3.10 rather than 3.12: `eblfrac` declares >=3.10 and `gratinglab` >=3.11.
# A shared package cannot raise the floor of the projects it serves.
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Jake McCoy" }]
keywords = ["gui", "pyside6", "matplotlib", "macos", "scientific", "packaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Deliberately empty, and the one line in this file worth defending.
#
# `eblfrac` declares `dependencies = []` on purpose -- its fracture engine and
# GPF writer install anywhere, including on a machine with no scientific stack
# at all. A shared package that forced numpy on it would take that away, and it
# would take it away silently, at install time, from every downstream user.
# Everything here that needs numpy, matplotlib or a toolkit lives behind an
# extra and is imported inside the function that needs it.
dependencies = []

[project.optional-dependencies]
# PySide6-Essentials rather than the PySide6 meta-package: the Addons
# (WebEngine, Multimedia, 3D) are hundreds of megabytes no window served by
# this package touches. Essentials still carries QtSvg, which matplotlib's Qt
# shim imports unconditionally.
#
# PySide6 (LGPLv3) rather than PyQt5/PyQt6 (GPL). This package is BSD-3, and an
# optional, dynamically-linked LGPL dependency keeps it that way -- the same
# reasoning every project downstream of it already applies to its own GUI extra.
#
# matplotlib belongs here, not only in `mpl`. `endstation.qt.canvas` embeds a
# figure and `use_qt_backend` pins the backend, so a `qt` install without it
# gives a FigurePane that raises on construction -- and raises with a bare
# ModuleNotFoundError, which is the exact failure this package exists to
# replace. Declaring it is the fix; `require_extra` in use_qt_backend is the
# backstop for anyone who installs the pieces by hand.
qt = ["PySide6-Essentials>=6.7", "matplotlib>=3.8"]
mpl = ["matplotlib>=3.8"]
# Rendering documentation needs matplotlib for the equations and nothing else:
# the markdown subset Qt actually renders is small enough that a full CommonMark
# implementation would mostly be output this cannot use, and the conversion has
# to interleave with math extraction anyway.
docs = ["matplotlib>=3.8"]
testing = ["pytest>=7"]
dev = [
    "pytest>=7",
    "pytest-qt>=4.5",
    "PySide6-Essentials>=6.7",
    "matplotlib>=3.8",
    "ruff>=0.16",
    "copier>=9",
    # tomllib is 3.11+; this package supports 3.10 to match eblfrac's floor, and
    # the packaging tests read pyproject on every version. A backport is cheaper
    # than a skipif per test file -- the second of which is how the same gap
    # reached CI twice.
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
endstation-icon = "endstation.tools.make_icon:main"
endstation-app = "endstation.tools.make_app:main"
endstation-publish-wiki = "endstation.tools.publish_wiki:main"

[project.urls]
Homepage = "https://github.com/jamccoy/endstation"

# The pytest plugin is registered here rather than requiring every downstream
# conftest to name it. `endstation.testing.plugin` is import-safe without
# pytest installed at the module level only because pytest is what loads it.
[project.entry-points.pytest11]
endstation = "endstation.testing.plugin"

[tool.setuptools.dynamic]
version = { attr = "endstation.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561. Every module here is annotated, and without this marker a consumer's
# type checker silently ignores all of it -- the annotations exist and do
# nothing, which is worse than not having them.
[tool.setuptools.package-data]
endstation = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
# No `qt_api` here on purpose: it is a pytest-qt option, and this suite has
# to run in an environment that has never installed a toolkit. The plugin
# exports PYTEST_QT_API instead, which pytest-qt honours and which costs
# nothing when pytest-qt is absent.

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Ruff's own zero-config default before 0.x expanded it. Pyflakes (F) and the
# handful of pycodestyle error codes that are real bugs rather than style
# opinions -- undefined names, syntax errors, bare except -- not the ~900-rule
# everything selection ruff now applies with no config at all.
select = ["E4", "E7", "E9", "F"]
