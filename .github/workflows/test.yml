name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The load-bearing job. If the core ever grows a dependency, everything
  # downstream that declares `dependencies = []` silently inherits it at
  # install time -- so this runs first, on a bare interpreter, with nothing
  # installed but the package itself.
  core:
    name: core has no dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # No extras. Deliberately not `.[dev]` -- installing the toolkit here
      # would make the next step pass for the wrong reason.
      - name: Install the package alone
        run: python -m pip install -e .

      - name: Confirm nothing third-party came with it
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys, json
          out = subprocess.run([sys.executable, "-m", "pip", "list",
                                "--format=json", "--not-required"],
                               capture_output=True, encoding="utf-8").stdout
          names = {p["name"].lower() for p in json.loads(out)}
          allowed = {"endstation", "pip", "setuptools", "wheel"}
          extra = names - allowed
          print("installed:", sorted(names))
          if extra:
              sys.exit(f"installing endstation pulled in: {sorted(extra)}")
          PY

      # A plain probe rather than pytest: this environment is deliberately bare,
      # and installing pytest to test that nothing was installed would defeat
      # the job. The same assertion runs under pytest in the `test` job, where a
      # test runner legitimately exists.
      - name: Import the core on a bare interpreter
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys
          CORE = ["endstation", "endstation.optional", "endstation.progress",
                  "endstation.forms", "endstation.paths"]
          FORBIDDEN = ("numpy", "scipy", "matplotlib", "PySide6", "PyQt5",
                       "PyQt6", "pandas", "pydantic", "markdown")
          failures = []
          for module in CORE:
              probe = subprocess.run(
                  [sys.executable, "-c",
                   f"import sys, {module}\n"
                   f"leaked = sorted({{n.split('.')[0] for n in sys.modules}} & set({FORBIDDEN!r}))\n"
                   "print('\\n'.join(leaked))"],
                  capture_output=True, encoding="utf-8", errors="replace")
              if probe.returncode != 0:
                  failures.append(f"{module} failed to import:\n{probe.stderr}")
              elif probe.stdout.split():
                  failures.append(f"{module} pulled in {', '.join(probe.stdout.split())}")
              else:
                  print(f"ok  {module}")
          if failures:
              sys.exit("\n".join(failures))
          PY

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # One macOS run: it is the development platform, and it is the only
          # one where the .app builder does anything at all.
          - os: macos-latest
            python-version: "3.12"
          # One Windows run. Nothing here is Windows-specific, which is exactly
          # how it broke there: a text read with no encoding uses the locale,
          # cp1252 on Windows, and `endstation-publish-wiki` died on the first
          # UTF-8 page gratinglab gave it.
          - os: windows-latest
            python-version: "3.12"

    name: ${{ matrix.os }} / py${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt's *offscreen* platform plugin needs no X server, so no Xvfb and none
      # of the libxcb-* family -- but libQt6Gui still links EGL, and fontconfig
      # and GLib have to be present for the plugin to load at all.
      #
      # libglib2.0-0 was renamed libglib2.0-0t64 in Ubuntu 24.04; the old name
      # fails this step. If the plugin still refuses to load, QT_DEBUG_PLUGINS=1
      # names the missing .so directly.
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libglib2.0-0t64 libdbus-1-3 libfontconfig1 \
            libfreetype6 libxkbcommon0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      # The Qt tests guard themselves with importorskip, which would hide a
      # broken toolkit install as a quietly shrinking suite. This makes it loud,
      # and it fails here -- next to the apt step that would be at fault --
      # rather than as a mystery in the test job.
      #
      # Constructing a QApplication, not merely importing: the import succeeds
      # long before the platform plugin is asked to load, which is where a
      # missing system library actually bites.
      - name: Confirm the GUI toolkit installed
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python -W error -c "
          import matplotlib, PySide6
          from PySide6.QtWidgets import QApplication
          QApplication([])
          print('PySide6', PySide6.__version__, '| matplotlib', matplotlib.__version__)
          "

      # `coverage run -m pytest`, not `pytest --cov`. This package registers a
      # pytest11 entry point, and pytest imports entry-point plugins before its
      # own conftest -- so under `--cov` the whole dependency-free core is
      # already imported before coverage starts recording, and reports as
      # uncovered. See the comment in pyproject.toml. -rs prints skip reasons,
      # which the next step reads.
      # PYTHONWARNDEFAULTENCODING makes every open(), read_text() and
      # subprocess text=True that leaves out its encoding raise an
      # EncodingWarning, and pyproject's `filterwarnings = ["error"]` turns that
      # into a failure. So the cp1252 fault fails on Linux and macOS too, where
      # the default happens to be UTF-8 and the bug is otherwise invisible.
      - name: Run tests
        shell: bash
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m coverage run -m pytest -v -rs --durations=10 2>&1 | tee result.txt

      - name: Coverage
        shell: bash
        run: python -m coverage report

      # What the old "at least 130 tests passed" floor was actually reaching
      # for, said directly. A number answers the question badly: it tolerated a
      # 30% collapse, and it needed raising by hand every time the suite grew,
      # so it only ever rotted downward.
      #
      # The failure it exists to catch is the Qt tests skipping because the
      # toolkit stopped installing -- every one of them guards itself with
      # `importorskip`, which turns a broken install into a quietly smaller
      # suite rather than a red run. This job installs `.[dev]`, so the toolkit
      # is meant to be present and that skip reason must not appear.
      - name: Confirm the suite did not quietly shrink
        shell: bash
        run: |
          python - <<'PY'
          import re, sys
          text = open("result.txt", encoding="utf-8", errors="replace").read()
          problems = []

          if "the qt extra is not installed" in text:
              problems.append(
                  "Qt tests skipped in a job that installs .[dev]; "
                  "the toolkit did not install. QT_DEBUG_PLUGINS=1 names the "
                  "missing library."
              )

          # A backstop against total collection failure, not a coverage proxy.
          # Deliberately far below the real count so it never needs editing.
          match = re.search(r"(\d+) passed", text)
          passed = int(match.group(1)) if match else 0
          print(f"{passed} passed")
          if passed < 100:
              problems.append(f"only {passed} tests passed; collection looks broken")

          if problems:
              sys.exit("\n".join(problems))
          PY

      - name: Check the public API imports
        shell: bash
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: |
          python -W error::EncodingWarning -c "
          import endstation
          from endstation import require_extra, Cancelled, ErrorCollector, find_data
          from endstation.qt.jobs import JobRunner
          from endstation.docs import to_html
          print('version', endstation.__version__)
          print('exports', len(endstation.__all__))
          "
